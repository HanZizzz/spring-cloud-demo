name: spring-cloud-demo

services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: nacos-standalone
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=U2VjdXJlTmFjb3NBdXRoVG9rZW5Gb3JEZW1vUHVycG9zZXMxMjM=
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=nacos-demo-node
    ports:
      - "8848:8848"   # Nacos HTTP API 端口
      - "9848:9848"   # 客户端 gRPC 通信端口
#      - "8080:8080"   # Nacos 3.x 控制台端口
      - "8081:8080"   # ports 映射的左侧端口号为本机目录
    volumes:
      - ./nacos-data:/home/nacos/data
      - ./nacos-logs:/home/nacos/logs
    restart: unless-stopped
    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/ns/health"]
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
