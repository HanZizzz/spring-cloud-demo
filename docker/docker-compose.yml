name: spring-cloud-demo

services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: nacos-standalone
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=U2VjdXJlTmFjb3NBdXRoVG9rZW5Gb3JEZW1vUHVycG9zZXMxMjM=
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=nacos-demo-node
    ports:
      - "8848:8848"   # Nacos HTTP API 端口
      - "9848:9848"   # 客户端 gRPC 通信端口
#      - "8080:8080"   # Nacos 3.x 控制台端口
      - "8081:8080"   # ports 映射的左侧端口号为本机目录
    volumes:
      - ./nacos-data:/home/nacos/data
      - ./nacos-logs:/home/nacos/logs
    restart: unless-stopped
    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/ns/health"]
#      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]  # Nacos 3.x 已移除 v1, 返回 404, 容器会一直 unhealthy
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v3/admin/core/state/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  sentinel-dashboard:
    # build:
      # context: ./sentinel          # 里面放 Dockerfile 和 sentinel-dashboard-1.8.8.jar
      # 或者用社区镜像,二选一:
    image: bladex/sentinel-dashboard
    container_name: sentinel-dashboard
    ports:
      - "8858:8858"                # 左边是宿主机端口,右边是容器内端口
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - TZ=Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      # 只在 mysql-data 为空(首次启动)时执行顶层的 *.sql, 子目录 manual/ 里的业务库脚本不会被执行, 需要手动导入
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      # 必须走 TCP(127.0.0.1): 初始化阶段的临时 mysqld 只监听 socket, 走 socket 会提前判定为健康
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  seata-server:
    image: apache/seata-server:2.5.0
    container_name: seata-server
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8091:8091"                # TC 通信端口, 客户端直连 <宿主机IP>:8091
    volumes:
      - ./seata/application.yml:/seata-server/resources/application.yml:ro
      # 镜像不带 MySQL 驱动, 需要放进 libs(classpath 是 libs/*)
      # 下载: curl -o docker/seata/jdbc/mysql-connector-j-8.0.33.jar https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.0.33/mysql-connector-j-8.0.33.jar
      - ./seata/jdbc/mysql-connector-j-8.0.33.jar:/seata-server/libs/mysql-connector-j-8.0.33.jar:ro
    restart: unless-stopped

